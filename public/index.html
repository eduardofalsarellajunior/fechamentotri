<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fechamento INEPAD</title><style>body{font-family:Inter,Arial;background:#f4f6f8;color:#17212b;margin:0}header{background:#123b5d;color:white;padding:18px 28px;display:flex;justify-content:space-between}main{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #0001}input,select,button{padding:10px;border:1px solid #ccd5dd;border-radius:7px;margin:5px}button{background:#1473a8;color:white;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.hidden{display:none}.result{font-size:1.15rem}.danger{color:#b3261e}.tabs button{background:#dceaf3;color:#123b5d}.tabs button.active{background:#1473a8;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e5e9ed;text-align:left}</style></head><body><header><b>INEPAD · Fechamento de Caixa</b><span id="who"></span></header><main><section id="login" class="card"><h2>Acesso</h2><p>Entre com seu usuário e senha.</p><form id="loginForm"><input id="username" placeholder="Usuário" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button></form><small>Administrador inicial: Eduardo / inepad2024</small><p id="loginError" class="danger"></p></section><section id="app" class="hidden"><div class="tabs"><button data-tab="closing">Fechamento</button><button data-tab="params" id="paramsTab">Parametrização</button></div><div id="closing" class="tab card"><h2>Fechamento trimestral</h2><div class="grid"><label>Trimestre <input id="quarter" placeholder="2026 T1"></label><label>Caixa apurado atual (R$) <input id="current" type="number" step="0.01"></label><label>Caixa distribuído trimestre anterior (R$) <input id="previous" type="number" step="0.01"></label><label>% distribuição <input id="distPct" type="number" value="90" min="0" max="100"></label></div><button id="calc">Calcular distribuição</button><div id="summary" class="result"></div><table id="resultTable"></table><button id="saveClosing" class="hidden">Salvar fechamento</button></div><div id="params" class="tab card hidden"><h2>Parâmetros (Eduardo)</h2><h3>Sócios</h3><form id="partnerForm" class="grid"><input name="name" placeholder="Nome" required><input name="id" placeholder="Usuário (ex: joao)" required><input name="share" type="number" placeholder="Participação %" required><input name="minimum" type="number" placeholder="Mínimo mensal R$" value="0"><input name="discount" type="number" placeholder="Desconto mensal R$" value="0"><input name="password" placeholder="Senha inicial"><button>Adicionar sócio</button></form><table id="partnersTable"></table><h3>Contas bancárias</h3><form id="bankForm"><input name="name" placeholder="Banco / conta" required><button>Adicionar conta</button></form><table id="banksTable"></table></div></section></main><script src="/public/app.js"></script></body></html>
